[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "elome"
version = "0.18.5"
description = "Elómë: analytic, differentiable transit light curves on Apple Silicon (MLX), with a batman-style frontend"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "David Kipping"}]
requires-python = ">=3.10"
dependencies = ["mlx>=0.30", "numpy"]
keywords = ["exoplanets", "transits", "light curves", "limb darkening",
            "oblate planets", "MLX", "Metal", "Apple Silicon"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
]

[project.urls]
Documentation = "https://elome.readthedocs.io"
Source = "https://github.com/davidkipping/elome"
Issues = "https://github.com/davidkipping/elome/issues"

[project.optional-dependencies]
test = ["pytest", "scipy", "batman-package", "mpmath"]
# the documentation's build dependencies are pinned in docs/requirements.txt.
# the sampling engine, anvil, is an optional integration dependency --
# install it separately for elome.anvil:
#   pip install git+https://github.com/davidkipping/anvil

[tool.setuptools.packages.find]
include = ["elome*"]

[tool.pytest.ini_options]
markers = ["slow: long-running statistical/integration tests"]
